name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ["1.21"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=arm64 go build -o dist/hitechcloudpanel-linux-arm64 ./cmd/agent.go
          GOOS=linux GOARCH=arm go build -o dist/hitechcloudpanel-linux-arm ./cmd/agent.go
          GOOS=linux GOARCH=amd64 go build -o dist/hitechcloudpanel-linux-amd64 ./cmd/agent.go
          GOOS=linux GOARCH=386 go build -o dist/hitechcloudpanel-linux-386 ./cmd/agent.go

      - name: Compress files (optional but recommended)
        run: |
          cd dist
          tar -czf hitechcloudpanel-linux-arm64.tar.gz hitechcloudpanel-linux-arm64
          tar -czf hitechcloudpanel-linux-arm.tar.gz hitechcloudpanel-linux-arm
          tar -czf hitechcloudpanel-linux-amd64.tar.gz hitechcloudpanel-linux-amd64
          tar -czf hitechcloudpanel-linux-386.tar.gz hitechcloudpanel-linux-386

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}